name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if echo "$before" | grep -q '^0\+$'; then
              git show --check --pretty=format: --no-renames HEAD
            else
              git cat-file -e "$before^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$before"
              git diff --check "$before" "${{ github.sha }}"
            fi
          fi

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required architecture files
        run: |
          test -f docs/architecture/overall-architecture-review.md
          test -f docs/architecture/observability.md
          test -f docs/architecture/security.md
          test -f docs/architecture/migration-strategy.md
          test -f docs/architecture/eventing-outbox.md
          test -f packages/contracts/api-conventions.md
          test -f packages/contracts/error-codes.md
          test -f ops/deployment/mysql-bootstrap.sql
          test -f ops/deployment/compose.production.yml
          test -f ops/deployment/Dockerfile.backend
          test -f ops/deployment/Dockerfile.web
          test -f ops/deployment/env.production.example
          test -f apps/api/requirements-prod.lock
          test -f scripts/probe_object_storage.py
          test -f scripts/check_tenant_binding.py

      - name: Validate production deployment bundle
        run: |
          python scripts/production_preflight.py --help
          AIRANK_BACKEND_IMAGE=example.invalid/airank-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
          AIRANK_WEB_IMAGE=example.invalid/airank-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
          docker compose -f ops/deployment/compose.production.yml config --quiet

      - name: Check terminology drift
        run: |
          ! grep -R "FactCard\|fact_card\|ready_for_pattern" README.md docs packages ops --exclude="ci-quality-gates.md"

      - name: Check bootstrap schema essentials
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS airank_projects" ops/deployment/mysql-bootstrap.sql
          grep -q "CREATE TABLE IF NOT EXISTS airank_fact_atoms" ops/deployment/mysql-bootstrap.sql
          grep -q "CREATE TABLE IF NOT EXISTS airank_async_jobs" ops/deployment/mysql-bootstrap.sql
          grep -q "CREATE TABLE IF NOT EXISTS airank_outbox_events" ops/deployment/mysql-bootstrap.sql
          grep -q "heartbeat_at" ops/deployment/mysql-bootstrap.sql
          grep -q "timeout_seconds" ops/deployment/mysql-bootstrap.sql

  api-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run contract tests
        run: python -m pytest tests/contracts

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run complete non-external backend suite
        run: python -m pytest -q

      - name: Run deterministic quality gates
        run: |
          python scripts/evaluate_provider_citations.py
          python scripts/evaluate_core_skills.py
          python scripts/audit_skill_trust.py

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: airank_laike
          MYSQL_USER: airank
          MYSQL_PASSWORD: airank-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      AIRANK_DATABASE_URL: mysql+pymysql://airank:airank-test-password@127.0.0.1:3306/airank_laike?charset=utf8mb4
      AIRANK_RUN_REAL_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Apply the complete schema
        working-directory: apps/api
        run: python -m alembic upgrade head

      - name: Run real MySQL integration suite
        run: python -m pytest tests/integration -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Enforce release bundle budget
        working-directory: apps/web
        run: npm run check:bundle

      - name: Audit production web dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  production-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build production backend image
        run: >-
          docker build
          --build-arg AIRANK_BUILD_COMMIT=${{ github.sha }}
          --file ops/deployment/Dockerfile.backend
          --tag airank-backend:ci .

      - name: Build production web image
        run: >-
          docker build
          --file ops/deployment/Dockerfile.web
          --tag airank-web:ci .

      - name: Verify non-root image identities and backend imports
        run: |
          test "$(docker image inspect airank-backend:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect airank-web:ci --format '{{.Config.User}}')" = "101"
          docker run --rm --entrypoint python3 airank-backend:ci -c \
            'import apps.api.main, apps.runtime_health, airank_worker.main, airank_scheduler.main'
          docker run --rm --entrypoint python3 airank-backend:ci -c \
            'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
          docker run --rm --entrypoint /bin/sh airank-backend:ci -ec \
            'test ! -e /usr/local/bin/pip && test ! -d /usr/local/lib/python3.11/site-packages/pip && test ! -d /usr/local/lib/python3.11/site-packages/setuptools && test ! -d /usr/local/lib/python3.11/site-packages/wheel'
          docker run --rm --add-host api:127.0.0.1 --entrypoint nginx airank-web:ci -t

      - name: Audit exact production Python lock
        run: |
          python -m venv /tmp/airank-audit
          /tmp/airank-audit/bin/python -m pip install --quiet pip-audit==2.9.0
          /tmp/airank-audit/bin/python -m pip_audit \
            --progress-spinner off \
            --requirement apps/api/requirements-prod.lock

      - name: Scan final images
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 airank-backend:ci
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 airank-web:ci

  marketing-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIRank素材/Web宣传/airank-design-grade-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AIRank素材/Web宣传/airank-design-grade-frontend/package-lock.json

      - name: Install marketing-site dependencies
        run: npm ci --ignore-scripts

      - name: Run marketing-site release gate
        run: npm run release:check
