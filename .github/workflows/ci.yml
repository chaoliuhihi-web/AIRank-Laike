name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  diff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if echo "$before" | grep -q '^0\+$'; then
              git show --check --pretty=format: --no-renames HEAD
            else
              git diff --check "$before" "${{ github.sha }}"
            fi
          fi

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required architecture files
        run: |
          test -f docs/architecture/overall-architecture-review.md
          test -f docs/architecture/observability.md
          test -f docs/architecture/security.md
          test -f docs/architecture/migration-strategy.md
          test -f docs/architecture/eventing-outbox.md
          test -f packages/contracts/api-conventions.md
          test -f packages/contracts/error-codes.md
          test -f ops/deployment/mysql-bootstrap.sql

      - name: Check terminology drift
        run: |
          ! grep -R "FactCard\|fact_card\|ready_for_pattern" README.md docs packages ops --exclude="ci-quality-gates.md"

      - name: Check bootstrap schema essentials
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS airank_projects" ops/deployment/mysql-bootstrap.sql
          grep -q "CREATE TABLE IF NOT EXISTS airank_fact_atoms" ops/deployment/mysql-bootstrap.sql
          grep -q "CREATE TABLE IF NOT EXISTS airank_async_jobs" ops/deployment/mysql-bootstrap.sql
          grep -q "CREATE TABLE IF NOT EXISTS airank_outbox_events" ops/deployment/mysql-bootstrap.sql
          grep -q "heartbeat_at" ops/deployment/mysql-bootstrap.sql
          grep -q "timeout_seconds" ops/deployment/mysql-bootstrap.sql

  api-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API test dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt

      - name: Run contract tests
        run: python -m pytest tests/contracts

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web
        working-directory: apps/web
        run: npm run build

  marketing-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIRank素材/Web宣传/airank-design-grade-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: AIRank素材/Web宣传/airank-design-grade-frontend/package-lock.json

      - name: Install marketing-site dependencies
        run: npm ci --ignore-scripts

      - name: Run marketing-site release gate
        run: npm run release:check
