[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/product.html"
  to = "/product/"
  status = 301
[[redirects]]
  from = "/solutions.html"
  to = "/solutions/"
  status = 301
[[redirects]]
  from = "/cases.html"
  to = "/cases/"
  status = 301
[[redirects]]
  from = "/resources.html"
  to = "/resources/"
  status = 301
[[redirects]]
  from = "/pricing.html"
  to = "/pricing/"
  status = 301
[[redirects]]
  from = "/diagnosis.html"
  to = "/diagnosis/"
  status = 301
[[redirects]]
  from = "/trial.html"
  to = "/diagnosis/"
  status = 301
[[redirects]]
  from = "/checkup.html"
  to = "/diagnosis/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
