name: airank-production

x-backend: &backend
  image: ${AIRANK_BACKEND_IMAGE:?set AIRANK_BACKEND_IMAGE to an immutable image digest}
  env_file:
    - path: .env.production
      required: false
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
  shm_size: 1gb
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"
  networks:
    - backend
  volumes:
    - browser_profiles:/var/lib/airank/browser-profiles
    - browser_captures:/var/lib/airank/browser-captures

services:
  migrate:
    <<: *backend
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - export AIRANK_DATABASE_URL="$${AIRANK_MIGRATION_DATABASE_URL:?set AIRANK_MIGRATION_DATABASE_URL}" && python3 scripts/production_preflight.py --role migration && cd apps/api && python3 -m alembic upgrade head
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 512

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - python3 scripts/production_preflight.py --role api && exec python3 -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=* --no-access-log
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - python3 scripts/production_preflight.py --role worker && export AIRANK_WORKER_ID="$${AIRANK_WORKER_ID:-airank-worker}-$${HOSTNAME}" && exec python3 -m airank_worker.main --allow-global-scope --job-type all
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD
        - python3
        - -m
        - apps.runtime_health
        - check
        - --filename=worker.json
        - --component=worker
        - --maximum-age-seconds=600
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      replicas: ${AIRANK_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
          pids: 512

  scheduler:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - python3 scripts/production_preflight.py --role scheduler && exec python3 -m airank_scheduler.main --allow-global-scope --poll-seconds 30
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python3
        - -m
        - apps.runtime_health
        - check
        - --filename=scheduler.json
        - --component=scheduler
        - --maximum-age-seconds=120
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 512

  web:
    image: ${AIRANK_WEB_IMAGE:?set AIRANK_WEB_IMAGE to an immutable image digest}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    networks:
      - edge
      - backend
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 128

networks:
  edge: {}
  backend:
    internal: true

volumes:
  browser_profiles: {}
  browser_captures: {}
