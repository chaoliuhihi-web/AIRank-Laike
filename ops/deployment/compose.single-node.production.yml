name: airank-single-node-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-backend: &backend
  image: ${AIRANK_BACKEND_IMAGE:?set AIRANK_BACKEND_IMAGE to an immutable image digest}
  env_file:
    - path: .env.production
      required: true
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=192m
  shm_size: 512m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 384
  logging: *logging
  networks:
    - backend
    - egress
  volumes:
    - ${AIRANK_DATA_ROOT:?set AIRANK_DATA_ROOT}/browser-profiles:/var/lib/airank/browser-profiles
    - ${AIRANK_DATA_ROOT:?set AIRANK_DATA_ROOT}/browser-captures:/var/lib/airank/browser-captures
    - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/ca.pem:/run/secrets/airank-internal-ca.pem:ro
    - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/ca-bundle.pem:/run/secrets/airank-ca-bundle.pem:ro
  environment:
    AWS_CA_BUNDLE: /run/secrets/airank-ca-bundle.pem
    SSL_CERT_FILE: /run/secrets/airank-ca-bundle.pem

services:
  mysql:
    image: ${AIRANK_MYSQL_IMAGE:?set AIRANK_MYSQL_IMAGE to an immutable image digest}
    hostname: airank-db
    env_file:
      - path: .env.production
        required: true
    restart: unless-stopped
    command:
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3
      - --ssl-ca=/etc/mysql/certs/ca.pem
      - --ssl-cert=/etc/mysql/certs/server-cert.pem
      - --ssl-key=/etc/mysql/certs/server-key.pem
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
      - --performance-schema=OFF
      - --skip-name-resolve
    volumes:
      - ${AIRANK_DATA_ROOT:?set AIRANK_DATA_ROOT}/mysql:/var/lib/mysql
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/ca.pem:/etc/mysql/certs/ca.pem:ro
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/mysql-server.pem:/etc/mysql/certs/server-cert.pem:ro
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/mysql-server-key.pem:/etc/mysql/certs/server-key.pem:ro
      - ./mysql/airank-init.sh:/docker-entrypoint-initdb.d/01-airank-init.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root --ssl-mode=REQUIRED --silent
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging: *logging
    networks:
      backend:
        aliases:
          - airank-db
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
          pids: 256

  minio:
    image: ${AIRANK_MINIO_IMAGE:?set AIRANK_MINIO_IMAGE to an immutable image digest}
    hostname: airank-objects
    env_file:
      - path: .env.production
        required: true
    restart: unless-stopped
    command:
      - server
      - /data
      - --address
      - :9000
      - --console-address
      - :9001
      - --certs-dir
      - /root/.minio/certs
    volumes:
      - ${AIRANK_DATA_ROOT:?set AIRANK_DATA_ROOT}/minio:/data
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/minio-public.crt:/root/.minio/certs/public.crt:ro
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/minio-private.key:/root/.minio/certs/private.key:ro
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/ca.pem:/root/.minio/certs/CAs/ca.crt:ro
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging: *logging
    networks:
      backend:
        aliases:
          - airank-objects
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
          pids: 128

  yudao-proxy:
    image: ${AIRANK_NGINX_IMAGE:?set AIRANK_NGINX_IMAGE to an immutable image digest}
    hostname: airank-yudao
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=8m
    volumes:
      - ./yudao-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/yudao-proxy.crt:/run/secrets/tls.crt:ro
      - ${AIRANK_SECRET_ROOT:?set AIRANK_SECRET_ROOT}/pki/yudao-proxy.key:/run/secrets/tls.key:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/ || exit 1
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    logging: *logging
    networks:
      backend:
        aliases:
          - airank-yudao
      egress: {}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96m
          pids: 96

  object-storage-bootstrap:
    <<: *backend
    restart: "no"
    pids_limit: 128
    depends_on:
      minio:
        condition: service_started
    command:
      - python3
      - scripts/bootstrap_object_storage.py
      - --wait-seconds
      - "60"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
          pids: 128

  migrate:
    <<: *backend
    restart: "no"
    pids_limit: 256
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - export AIRANK_DATABASE_URL="$${AIRANK_MIGRATION_DATABASE_URL:?set AIRANK_MIGRATION_DATABASE_URL}" && python3 scripts/production_preflight.py --role migration && cd apps/api && python3 -m alembic upgrade head
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768m
          pids: 256

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage-bootstrap:
        condition: service_completed_successfully
      yudao-proxy:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - python3 scripts/production_preflight.py --role api && exec python3 -m uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=* --no-access-log
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
          pids: 384

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage-bootstrap:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - python3 scripts/production_preflight.py --role worker && exec python3 -m airank_worker.main --allow-global-scope --job-type all
    stop_grace_period: 90s
    healthcheck:
      test:
        - CMD
        - python3
        - -m
        - apps.runtime_health
        - check
        - --filename=worker.json
        - --component=worker
        - --maximum-age-seconds=600
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m
          pids: 384

  scheduler:
    <<: *backend
    pids_limit: 192
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - /bin/sh
      - -ec
      - python3 scripts/production_preflight.py --role scheduler && exec python3 -m airank_scheduler.main --allow-global-scope --poll-seconds 30
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python3
        - -m
        - apps.runtime_health
        - check
        - --filename=scheduler.json
        - --component=scheduler
        - --maximum-age-seconds=120
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 192

  web:
    image: ${AIRANK_WEB_IMAGE:?set AIRANK_WEB_IMAGE to an immutable image digest}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 96
    logging: *logging
    networks:
      - edge
      - backend
    ports:
      - "127.0.0.1:${AIRANK_WEB_PORT:-18080}:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
          pids: 96

networks:
  edge: {}
  egress:
    ipam:
      config:
        - subnet: 172.30.40.0/24
          gateway: 172.30.40.1
  backend:
    internal: true
